services:
  - type: web
    name: bulochka-control-web
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: bulochka-control-db
          property: connectionString

databases:
  - name: bulochka-control-db
    databaseName: bulochka
    user: bulochka
